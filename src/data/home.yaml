projects:
  - title: "Wrinkle segmentation with U-Net"
    problem: "Fine facial wrinkles are tiny, ambiguous structures with scarce labels and extreme class imbalance."
    built: "Built and evaluated a deep learning segmentation pipeline with U-Net-style architectures, face preprocessing, and mask quality analysis."
    stack: ["Python", "PyTorch", "U-Net", "Computer Vision"]
    link: "/blog/2025-04-18-wrinkle-segmentation.html"
    image: "img/young-old-wrinkles.png"
    accent: "coral"

  - title: "Stable Diffusion XL fine-tuning"
    problem: "Fine-tuning image generation models on small personal datasets requires careful choices around LoRA, prompts, and training steps."
    built: "Documented an SDXL LoRA workflow with Colab, validation images, prompt experiments, and practical lessons from a constrained setup."
    stack: ["Diffusers", "SDXL", "LoRA", "Colab"]
    link: "/blog/2024-06-15-sdxlfinetuning.html"
    image: "img/Thor_Hawaii_cover.jpg"
    accent: "yellow"

  - title: "GenAI tools for non-technical users"
    problem: "Marketing and design teams need a grounded view of what image generation tools can and cannot do."
    built: "Compared Midjourney, Adobe Firefly, Stable Diffusion, and related tools through practical use cases, limitations, and workflow observations."
    stack: ["GenAI", "Image Tools", "Design Workflows"]
    link: "/blog/2024-08-19-genainontechnicalusers.html"
    image: "img/nico_mur.jpg"
    accent: "orange"

  - title: "Medical imaging for ablation assessment"
    problem: "Liver tumor ablation outcomes need objective volumetric assessment beyond subjective 2D inspection."
    built: "Developed image-based evaluation methods during PhD research, later connected to commercial medical device workflows."
    stack: ["Medical Imaging", "Python", "Research", "Clinical Data"]
    link: "/publications.html"
    image: "img/workflow-unet.png"
    accent: "green"

  - title: "Distilled Stable Diffusion with Gradio"
    problem: "Diffusion demos should be approachable without hiding the model and deployment trade-offs."
    built: "Created a Colab and Gradio walkthrough for distilled Stable Diffusion, including interface theming and practical inference notes."
    stack: ["Stable Diffusion", "Gradio", "Colab", "Python"]
    link: "/blog/2023-11-04-ssdgradio1.html"
    image: "img/transfagarasan_dalle.png"
    accent: "coral"

  - title: "Midjourney photography experiments"
    problem: "Realistic AI photography depends on prompt control, camera language, lighting, and composition."
    built: "Collected prompt strategies and visual examples for realistic photo generation with Midjourney."
    stack: ["Midjourney", "Prompting", "Photography"]
    link: "/blog/2024-04-04-midjourney.html"
    image: "img/cover_mj_post_youaremystar.png"
    accent: "yellow"

