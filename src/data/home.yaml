problems:
  - quote: "We know AI could help us, but we don't know where to start."
    body: "I help turn vague ideas into concrete use cases, requirements and realistic technical options."
  - quote: "There are too many models and tools. Which approach actually makes sense?"
    body: "I evaluate realistic options based on performance, data, cost, infrastructure, privacy and implementation constraints."
  - quote: "The prototype works. Turning it into something reliable is another problem."
    body: "I help move from experiment to validated, integrated and production-oriented AI systems."

how_i_help:
  - step: "Understand"
    title: "AI Discovery & Technical Strategy"
    body: "Clarify the problem, identify valuable AI opportunities and determine what is technically realistic."
  - step: "Plan"
    title: "Model, Tool & Architecture Evaluation"
    body: "Compare approaches and select models, tools and architectures based on real constraints rather than hype."
  - step: "Build"
    title: "Prototyping & Implementation"
    body: "Build, test and integrate solutions and help move promising prototypes toward real-world use."
