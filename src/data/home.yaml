profile:
  name: "Raluca-Maria Sandu"
  role: "AI/ML engineer and researcher"
  location: "Zurich, Switzerland"
  summary:
    - text: "I am an applied AI/ML engineer with around 20 years of coding experience and a PhD in Biomedical Engineering. My industry work has mostly focused on visual AI, building systems that classify, understand, generate and reason about images, video, and the physical world. During my PhD, I worked on medical imaging research for liver cancer, which led to journal publications and contributions to a "
    - text: "commercial product deployed in hospitals."
      url: "https://www.cascination.com/en/ablasure"
    - text: " My current technical curiosity is physical AI: how machines can understand, navigate, and interact with our messy, beautiful 3D world. That interest also connects deeply with my life outside work. I am happiest outdoors — surfing, skiing, snowboarding, gardening, and "
    - text: "birdwatching"
      url: "https://ebird.org/profile/NTI4NTk0OQ/world"
    - text: " — and I am currently taking ornithology classes. For me, AI is most exciting when it helps us perceive, understand, and protect the real world around us."
  personal: ""
  email: "rmsan@duck.com"
  github: "https://github.com/rmsandu"
  linkedin: "https://linkedin.com/in/rmsandu"
  scholar: "https://scholar.google.com/citations?user=5qskcz0AAAAJ"
  cv: "/static/Raluca_Sandu_CV.pdf"
  portrait: "img/portrait_scaled.jpg"

